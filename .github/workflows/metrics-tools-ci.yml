name: Metrics Tools CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "metrics/README.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/metrics-tools-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "metrics/README.md"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/metrics-tools-ci.yml"

permissions:
  contents: read

concurrency:
  group: metrics-tools-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m py_compile scripts/*.py tests/*.py

      - name: Run offline tests
        run: python -m unittest discover -s tests
