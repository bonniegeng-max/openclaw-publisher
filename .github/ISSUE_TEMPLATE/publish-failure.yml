name: 发布故障 / Publish failure
description: 报告 GitHub Actions、ClawHub registry 或安装链路中的可复现问题
title: "[Publish failure] "
body:
  - type: markdown
    attributes:
      value: |
        请只提交已脱敏的信息。不要粘贴 token、cookie、密钥或内部地址。

  - type: dropdown
    id: layer
    attributes:
      label: 故障发生在哪一层
      options:
        - 本地文件或 dry-run
        - GitHub push 或 Actions
        - ClawHub publish 或 moderation
        - inspect、公开元数据或搜索
        - 独立安装或安装后文件
        - 尚未定位
    validations:
      required: true

  - type: input
    id: target
    attributes:
      label: 目标 Skill / Plugin
      description: 提供目录、slug 或 package 名称
      placeholder: skills/example-skill / example-skill / @owner/package
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本与提交
      description: 提供目标版本和 Git commit SHA；未知可写 unknown
      placeholder: 1.2.3 / abc1234
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      placeholder: 例如：Actions 成功，ClawHub latest 指向 1.2.3，并可独立安装
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 分开描述本地、GitHub、Actions、registry 和安装状态
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 最短复现步骤
      placeholder: |
        1. 修改……
        2. 执行……
        3. 观察……
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏证据
      description: 粘贴关键日志、dry-run JSON 或 inspect 字段，不要粘贴完整凭据
      render: shell
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: 可复现程度
      options:
        - 每次发生
        - 偶发，但已发生多次
        - 只发生一次
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: 安全确认
      options:
        - label: 我已删除 token、cookie、密钥和内部地址
          required: true
        - label: 我没有把 downloads 当作 installs
          required: true
